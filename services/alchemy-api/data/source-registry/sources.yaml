    citationTemplate: U.S. EPA CompTox/ToxCast release {release_id}.
    intendedUses: [compounds, assays, toxicity, exposure, bioactivity, endpoints]
    usefulFieldInventory: [chemical, assay, endpoint, result, unit, method]
    desiredGraphMapping: [Compound, BioactivityObservation, ToxicityObservation, ExposureObservation]
    licenseReviewNotes: U.S. government/open-data baseline; verify each download's release notice and upstream fields.

  - <<: *source_defaults
    sourceId: source:mondo
