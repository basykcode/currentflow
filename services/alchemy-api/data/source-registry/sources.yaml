  - <<: *source_defaults
    sourceId: source:pmc-open-access
    title: PubMed Central Open Access subset
    acronym: PMC OA
    responsibleOrganization: U.S. National Library of Medicine
    description: Article packages whose reuse rights are declared per article.
    officialHomepage: https://pmc.ncbi.nlm.nih.gov/tools/openftlist/
    officialDownloadPage: https://ftp.ncbi.nlm.nih.gov/pub/pmc/oa_package/
    sourceType: full_text_literature
    expectedScale: large per-article-rights corpus; subset imports only
    canonicalIdentifiersSupplied: [PMCID, PMID, DOI]
    rights: *unclear_rights
    sourceDataStatus: mixed_upstream_rights
    productionStatus: approved_with_conditions
    acquisitionMode: metadata_only
    adapterName: pmc-open-access
    citationTemplate: PMC Open Access article {pmcid}, license recorded per article.
    intendedUses: [rights-approved full text, passages, citations]
    useLimitations: [Eligibility is determined at article level, never from collection membership alone.]
    usefulFieldInventory: [PMCID, article license, XML, citation, section, reference]
    desiredGraphMapping: [Publication, Document, Passage, License, SourceRecord]
    licenseReviewNotes: Row/article-level rights override collection defaults.

  - <<: *source_defaults
    sourceId: source:chembl
    title: ChEMBL
    acronym: ChEMBL
    responsibleOrganization: EMBL-EBI
    description: Bioactive molecules, assays, targets, and measured activities.
