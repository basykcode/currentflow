    usefulFieldInventory: [ligand, target, affinity, unit, DOI, upstream source]
    desiredGraphMapping: [Compound, Protein, BioactivityObservation, Publication, License]
    licenseReviewNotes: Partition BindingDB-curated and ChEMBL-derived records with row-level rights.

  - <<: *source_defaults
    sourceId: source:pubchem
    title: PubChem
    acronym: PubChem
    responsibleOrganization: U.S. National Library of Medicine
