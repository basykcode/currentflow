    usefulFieldInventory: [CID, structure, synonym, contributor, annotation]
    desiredGraphMapping: [Compound, ExternalIdentifier, MappingAssertion, SourceRecord]
    licenseReviewNotes: Government platform metadata and mixed contributor content require field-level provenance.

  - <<: *source_defaults
