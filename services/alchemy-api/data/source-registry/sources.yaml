sources:
  - &source_defaults
    sourceId: source:disease-ontology
    title: Human Disease Ontology
    acronym: DO
    responsibleOrganization: Disease Ontology project, University of Maryland
    description: Open ontology of human disease concepts and their relationships.
    officialHomepage: https://disease-ontology.org/
    officialDownloadPage: https://disease-ontology.org/downloads/
    sourceType: ontology
    languages: [en]
    updateCadence: monthly
    expectedScale: approximately 12,000 disease classes per release
    canonicalIdentifiersSupplied: [DOID]
    knownUpstreamSources: []
    rights: &cc0_rights
      licenseName: CC0 1.0 Universal
      licenseUrl: https://creativecommons.org/publicdomain/zero/1.0/
      attributionRequirements:
        - Cite the Disease Ontology project and the release used.
      commercialUse: allowed
      redistribution: allowed
      derivativeDatabase: allowed
      aiUse: allowed
    sourceDataStatus: authoritative_release_verified
    productionStatus: approved
    acquisitionMode: automatic
    adapterName: disease-ontology-obo
    adapterVersion: "1"
    citationTemplate: Human Disease Ontology, release {release_id}, Disease Ontology project.
    intendedUses: [disease identity, disease hierarchy, synonyms, external identifier crosswalks]
    useLimitations:
      - Ontology membership and hierarchy do not establish diagnosis or clinical advice.
    safetyNotes:
      - Research classification only; no patient or diagnostic workflow.
    contactInformation: https://disease-ontology.org/about/contact/
    lastLicenseReviewDate: 2026-07-26
    licenseReviewNotes: The official project resources and pinned v2026-06-30 repository license both state CC0.
    usefulFieldInventory: [id, name, definition, synonym, xref, is_a, obsolete, replaced_by]
    desiredGraphMapping: [DiseaseConcept, SourceRecord, MappingAssertion, Claim, ExternalIdentifier]
    permissionRequestChecklist: []

  - <<: *source_defaults
    sourceId: source:usda-duke
    title: Dr. Duke's Phytochemical and Ethnobotanical Databases
    acronym: USDA Duke
    responsibleOrganization: U.S. Department of Agriculture, Agricultural Research Service
    description: Phytochemical, plant, biological-activity, ethnobotanical, and reference data.
    officialHomepage: https://phytochem.nal.usda.gov/
    officialDownloadPage: https://agdatacommons.nal.usda.gov/articles/dataset/Dr_Duke_s_Phytochemical_and_Ethnobotanical_Databases/24660351
    sourceType: natural_products_dataset
    updateCadence: irregular
    expectedScale: hundreds of thousands of tabular records
    canonicalIdentifiersSupplied: [USDA Duke source IDs, CAS when supplied]
    productionStatus: approved
    adapterName: usda-duke
    sourceDataStatus: release_verification_required
    citationTemplate: U.S. Department of Agriculture, Agricultural Research Service, Dr. Duke's databases, release {release_id}.
    intendedUses: [taxa, compounds, occurrence, biological activities, ethnobotanical uses, toxicity, references]
    useLimitations:
      - Do not create MedicinalMaterial identities automatically from plant records.
      - Retain the source warning against self-diagnosis and self-medication.
    usefulFieldInventory: [taxa, chemicals, activities, quantitative records, ethnobotany, references]
    desiredGraphMapping: [Taxon, Compound, CompoundOccurrence, BioactivityObservation, ToxicityObservation]
    licenseReviewNotes: CC0 is the task baseline; every selected release remains checksum and release-metadata gated.

  - <<: *source_defaults
    sourceId: source:lotus
    title: LOTUS natural products occurrence database
    acronym: LOTUS
    responsibleOrganization: LOTUS initiative
    description: Natural-product structures and organism occurrence with publication and upstream provenance.
    officialHomepage: https://lotus.naturalproducts.net/
    officialDownloadPage: https://github.com/lotusnprod/lotus-processor
    sourceType: natural_products_dataset
    updateCadence: periodic
    expectedScale: hundreds of thousands of structures and occurrence links
    canonicalIdentifiersSupplied: [InChIKey, SMILES, Wikidata identifiers]
    sourceDataStatus: release_verification_required
    productionStatus: approved
    adapterName: lotus
    citationTemplate: LOTUS natural products database, release {release_id}.
    intendedUses: [compound identity, taxon occurrence, publications, upstream provenance]
    useLimitations: [Do not infer clinical importance from occurrence.]
    usefulFieldInventory: [structure, organism, reference, contributing database]
    desiredGraphMapping: [Compound, Taxon, CompoundOccurrence, Publication, SourceRecord]
    licenseReviewNotes: CC0 is the task baseline; the exact release and included upstream fields require verification.

  - <<: *source_defaults
    sourceId: source:coconut
    title: Collection of Open Natural Products
    acronym: COCONUT
    responsibleOrganization: COCONUT project
    description: Open natural-product structures, identifiers, properties, and classifications.
    officialHomepage: https://coconut.naturalproducts.net/
    officialDownloadPage: https://zenodo.org/communities/coconut
    sourceType: natural_products_dataset
    updateCadence: periodic
    expectedScale: hundreds of thousands of compounds
    canonicalIdentifiersSupplied: [InChIKey, SMILES, source compound IDs]
    sourceDataStatus: release_verification_required
    productionStatus: approved
    adapterName: coconut
    citationTemplate: COCONUT, release {release_id}.
    intendedUses: [compound identity, structures, physicochemical properties, classification]
    useLimitations: [COCONUT presence is not evidence of occurrence in a medicinal material.]
    usefulFieldInventory: [structure, identifier, formula, physicochemical property, classification]
    desiredGraphMapping: [Compound, ChemicalClass, ExternalIdentifier, SourceRecord]
    licenseReviewNotes: Promote only a specifically verified CC0 release.

  - <<: *source_defaults
    sourceId: source:chebi
    title: Chemical Entities of Biological Interest
    acronym: ChEBI
    responsibleOrganization: EMBL-EBI
    description: Curated chemical ontology with identifiers, names, structures, and relationships.
    officialHomepage: https://www.ebi.ac.uk/chebi/
    officialDownloadPage: https://ftp.ebi.ac.uk/pub/databases/chebi/
    sourceType: chemical_ontology
    updateCadence: monthly
    expectedScale: hundreds of thousands of chemical entries and ontology links
    canonicalIdentifiersSupplied: [ChEBI ID, InChIKey, structure]
    rights: &ccby_rights
      licenseName: Creative Commons Attribution 4.0 International
      licenseUrl: https://creativecommons.org/licenses/by/4.0/
      attributionRequirements: [Retain source attribution and cite the selected release.]
      commercialUse: allowed
      redistribution: allowed
      derivativeDatabase: allowed
      aiUse: allowed
    sourceDataStatus: release_verification_required
    productionStatus: approved_with_conditions
    adapterName: chebi
    citationTemplate: ChEBI, EMBL-EBI, release {release_id}.
    intendedUses: [compound identity, synonyms, formula, charge, structure, chemical classes]
    usefulFieldInventory: [identifier, name, synonym, formula, charge, InChI, ontology relationship]
    desiredGraphMapping: [Compound, ChemicalClass, ExternalIdentifier, MappingAssertion]
    licenseReviewNotes: CC BY 4.0 is the task baseline; attribution must be carried into exports.

  - <<: *source_defaults
    sourceId: source:catalogue-of-life
    title: Catalogue of Life
    acronym: COL
    responsibleOrganization: Catalogue of Life
    description: Taxonomic names, accepted taxa, synonyms, classifications, and source provenance.
    officialHomepage: https://www.catalogueoflife.org/
    officialDownloadPage: https://www.catalogueoflife.org/data/download
    sourceType: taxonomy
    updateCadence: monthly and annual
    expectedScale: millions of taxa and names
    canonicalIdentifiersSupplied: [Catalogue of Life taxon ID]
    rights: *ccby_rights
    sourceDataStatus: release_verification_required
    productionStatus: approved_with_conditions
    acquisitionMode: manual
    adapterName: catalogue-of-life
    citationTemplate: Catalogue of Life Base Release {release_id}.
    intendedUses: [accepted taxa, synonyms, ranks, classifications, vernacular names]
    useLimitations: [Prefer the conservative Base Release and preserve component provenance.]
    usefulFieldInventory: [taxon ID, accepted name, synonym, rank, parent, source dataset]
    desiredGraphMapping: [Taxon, CanonicalName, Alias, MappingAssertion, SourceRecord]
    licenseReviewNotes: CC BY 4.0 is the baseline; component-level exceptions and interactive export are manual gates.

  - <<: *source_defaults
