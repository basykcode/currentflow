# yaml-language-server: $schema=https://render.com/schema/render.yaml.json

services:
  - type: web
    name: current-flow-alchemy-api
    runtime: docker
    plan: standard
    region: virginia
    branch: master
    autoDeployTrigger: checksPass
    dockerfilePath: ./services/alchemy-api/Dockerfile
    dockerContext: ./services/alchemy-api
    preDeployCommand: sh deploy/predeploy.sh
    dockerCommand: sh deploy/start.sh
    healthCheckPath: /api/v1/health/live
    domains:
      - api.current-flow.net
    buildFilter:
      paths:
        - services/alchemy-api/**
        - contracts/alchemy-openapi.json
        - render.yaml
    envVars:
      - key: ALCHEMY_ENV
        value: production
      - key: ALCHEMY_API_HOST
        value: 0.0.0.0
      - key: ALCHEMY_API_PORT
        value: '10000'
      - key: WEB_CONCURRENCY
        value: '1'
      - key: ALCHEMY_GRACEFUL_SHUTDOWN_SECONDS
        value: '30'
      - key: ALCHEMY_LOG_LEVEL
        value: INFO
      - key: ALCHEMY_ALLOWED_ORIGINS
        value: '["https://current-flow.net","https://www.current-flow.net"]'
      - key: ALCHEMY_SEED_DEMO
        value: '0'
      - key: ALCHEMY_ENSURE_FOUNDATION
        value: '1'
      - key: ALCHEMY_DATA_ROOT
        value: /app/.cache/alchemy-data
      - key: ALCHEMY_ORIGIN_TOKEN
        sync: false
      - key: ALCHEMY_REQUIRE_EDGE_ORIGIN_TOKEN
        value: '1'
      - key: ALCHEMY_MAX_REQUEST_BODY_BYTES
        value: '1048576'
      - key: ALCHEMY_REQUEST_TIMEOUT_SECONDS
        value: '30'
      - key: NEO4J_MAX_CONNECTION_POOL_SIZE
        value: '20'
      - key: NEO4J_CONNECTION_ACQUISITION_TIMEOUT_SECONDS
        value: '5'
      - key: NEO4J_CONNECTION_TIMEOUT_SECONDS
        value: '10'
      - key: NEO4J_MAX_CONNECTION_LIFETIME_SECONDS
        value: '1800'
      - key: NEO4J_LIVENESS_CHECK_TIMEOUT_SECONDS
        value: '30'
      - key: NEO4J_MAX_TRANSACTION_RETRY_TIME_SECONDS
        value: '15'
      - key: NEO4J_QUERY_TIMEOUT_SECONDS
        value: '15'
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USERNAME
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: NEO4J_DATABASE
        sync: false
      - key: PUBCHEM_USER_AGENT
        sync: false
      - key: EXTERNAL_REQUEST_TIMEOUT_SECONDS
        value: '20'
      - key: EXTERNAL_REQUEST_MIN_INTERVAL_MS
        value: '250'
