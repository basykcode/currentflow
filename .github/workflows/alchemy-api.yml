name: Alchemy API

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: alchemy-api-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  alchemy-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/alchemy-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm install --global npm@11.4.2
        working-directory: .
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.13'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.7.22'
          enable-cache: true
      - run: uv sync --locked --all-groups
      - name: Verify repository toolchain manifest
        working-directory: .
        run: npm run toolchain:check
      - name: Verify exact Python runtime
        working-directory: .
        run: >-
          python -c "import json, platform;
          manifest=json.load(open('config/toolchain.json'));
          expected=next(item['version'] for item in manifest['tools'] if item['tool']=='Python');
          assert platform.python_version()==expected, (platform.python_version(), expected)"
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run alchemy sources validate
      - run: uv run alchemy sources audit-rights
      - run: uv run pytest -m "not integration"
      - run: uv run alchemy openapi export --check

  alchemy-neo4j-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/alchemy-api
    services:
      neo4j:
        image: neo4j:5.26.28-community
        env:
          NEO4J_AUTH: neo4j/integration-password
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p integration-password 'RETURN 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      ALCHEMY_ENV: test
      ALCHEMY_ALLOWED_ORIGINS: '["http://localhost:5173"]'
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: integration-password
      NEO4J_DATABASE: neo4j
      PUBCHEM_USER_AGENT: CurrentAlchemy-CI/0.1
      ALCHEMY_RUN_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.13'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.7.22'
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run pytest -m integration
      - run: uv run alchemy graph audit

  alchemy-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: services/alchemy-api
          push: false
          tags: current-alchemy-api:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
