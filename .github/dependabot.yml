version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      frontend-production:
        dependency-type: production
      frontend-development:
        dependency-type: development
  - package-ecosystem: pip
    directory: /services/alchemy-api
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /services/alchemy-api
    schedule:
      interval: weekly
    groups:
      backend-base-images:
        patterns: ['*']
