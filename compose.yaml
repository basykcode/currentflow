name: ${COMPOSE_PROJECT_NAME:-current-flow}

services:
  neo4j:
    image: neo4j:5.26.28-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
      NEO4J_dbms_usage__report_enabled: 'false'
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
    ports:
      - '127.0.0.1:${CURRENT_FLOW_NEO4J_HTTP_PORT:-7474}:7474'
      - '127.0.0.1:${CURRENT_FLOW_NEO4J_BOLT_PORT:-7687}:7687'
    volumes:
      - alchemy_neo4j_data:/data
      - alchemy_neo4j_logs:/logs
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'cypher-shell -u "$${NEO4J_USERNAME}" -p "$${NEO4J_PASSWORD}" "RETURN 1" >/dev/null 2>&1',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  alchemy-api:
    build:
      context: ./services/alchemy-api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ALCHEMY_ENV: ${ALCHEMY_ENV:-development}
      ALCHEMY_API_HOST: 0.0.0.0
      ALCHEMY_API_PORT: 8000
      ALCHEMY_LOG_LEVEL: ${ALCHEMY_LOG_LEVEL:-INFO}
      ALCHEMY_ALLOWED_ORIGINS: ${ALCHEMY_ALLOWED_ORIGINS:-["http://localhost:5173"]}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      PUBCHEM_USER_AGENT: ${PUBCHEM_USER_AGENT:-CurrentAlchemy-local/0.1}
      EXTERNAL_REQUEST_TIMEOUT_SECONDS: ${EXTERNAL_REQUEST_TIMEOUT_SECONDS:-20}
      EXTERNAL_REQUEST_MIN_INTERVAL_MS: ${EXTERNAL_REQUEST_MIN_INTERVAL_MS:-250}
    ports:
      - '127.0.0.1:${CURRENT_FLOW_API_PORT:-8000}:8000'
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  alchemy_neo4j_data:
  alchemy_neo4j_logs:
